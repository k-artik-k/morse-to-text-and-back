<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Morse To Text To Morse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="window">
    <div class="titlebar">
        <span class="icon"></span>
        <span class="title">MORSEEE</span>
        <div class="caption">
            <span class="cap min">
                <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="7.5" width="9" height="3" fill="#fff" stroke="#1f2f4a"/></svg>
            </span>
            <span class="cap max">
                <svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5h9v9h-9z M3.5 4.5h5v4h-5z" fill="#fff" fill-rule="evenodd" stroke="#1f2f4a"/></svg>
            </span>
            <span class="cap close">
                <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2.5 2.5l9 9M11.5 2.5l-9 9" stroke="#3d0a00" stroke-opacity=".75" stroke-width="4.4" stroke-linecap="round"/><path d="M2.5 2.5l9 9M11.5 2.5l-9 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
            </span>
        </div>
    </div>

    <div class="client">
        <div class="top">
            <!-- <h1>Translate Morse code</h1> -->
            <!-- <p>Turn text into Morse beeps, and beeps back into text.</p> -->
        </div>

        <div class="body">
            <nav class="tabs">
                <button class="tab on" data-tab="encode">Text to Morse</button>
                <button class="tab" data-tab="decode">Morse to Text</button>
            </nav>

            <!-- ENCODE -->
            <section id="encodePane" class="panel">
                <textarea id="text" placeholder=""></textarea>

                <fieldset class="speed">
                    <legend>Pause length</legend>
                    <div class="slider-row">
                        <span class="end">Short</span>
                        <div class="slider">
                            <input type="range" id="gap" min="1" max="5" step="0.5" value="2">
                            <div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                        </div>
                        <span class="end">Long</span>
                    </div>
                    <div class="value">Current setting: <strong id="gapVal">2x</strong></div>
                    <div class="presets">
                        <span class="preset" data-v="4">Beginner</span>
                        <span class="preset" data-v="2">Easy</span>
                        <span class="preset" data-v="1">Normal</span>
                    </div>
                    <!-- <small>Beeps stay the same. Only the pauses between letters and words get longer.</small> -->
                </fieldset>

                <div id="preview" class="morse"></div>

                <div class="actions">
                    <button id="play" class="primary">Play</button>
                    <button id="stop">Stop</button>
                    <button id="save">Save WAV</button>
                </div>
            </section>

            <!-- DECODE -->
            <section id="decodePane" class="panel" hidden>
                <label class="file"><input type="file" id="audio" accept=".wav,audio/*"></label>
                <div class="actions">
                    <button id="decode" class="primary">Decode Audio</button>
                </div>
                <div id="decoded" class="big"></div>
                <div id="decMorse" class="morse"></div>
            </section>
        </div>

        <p id="status"></p>
    </div>
</div>


<script src="script.js"></script>
</body>
</html>
